[project]
name = "comfyui-id-lora-ltx"
version = "0.1.0"
description = "ComfyUI nodes for ID-LoRA-2.3 audio+video generation with speaker identity transfer"
requires-python = ">=3.10"
dependencies = [
    "ltx-core",
    "ltx-pipelines",
    "ltx-trainer @ git+https://github.com/ID-LoRA/ID-LoRA.git@13dc9c286a2d3c1a21a7781f9ac0fe7727ec56cd#subdirectory=ID-LoRA-2.3/packages/ltx-trainer ; platform_system != 'Darwin' and platform_machine != 'aarch64'",
    "torch",
    "torchaudio",
]
